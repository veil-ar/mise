<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
a,button{touch-action:manipulation}
:root{
  /* Layout: one centred column. Library rows split by hairlines; a recipe splits into ingredients | method on wide screens. */
  --bg:#EDF1EB; --surface:#F7F9F5; --ink:#14302A; --muted:#566B63; --line:#CFD8CE; --chip:#E0E8DE;
  --accent:#E8A91A; --on-accent:#1B1405; --danger:#B03A2E; --good:#2B7A55; --warn:#8F6200;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0D1714;--surface:#14231F;--ink:#E6EFE8;--muted:#8FA79C;--line:#25362F;--chip:#1C2D27;--accent:#F0B93A;--on-accent:#1B1405;--danger:#EC7B6F;--good:#6CCB9B;--warn:#F0B93A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0D1714;--surface:#14231F;--ink:#E6EFE8;--muted:#8FA79C;--line:#25362F;--chip:#1C2D27;--accent:#F0B93A;--on-accent:#1B1405;--danger:#EC7B6F;--good:#6CCB9B;--warn:#F0B93A;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 0;flex-wrap:wrap;row-gap:2px;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:baseline;gap:12px;text-decoration:none;min-width:0}
.mark b{font:700 1.75rem/1 var(--display);letter-spacing:-.03em}
.count{font:500 .72rem var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.view{padding-top:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:transparent;font-weight:600;text-decoration:none;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem}
.btn[disabled]{opacity:.35;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--ink)}
.icon:hover{background:var(--chip)}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.star[aria-pressed="true"] svg{fill:var(--accent)}

.search{position:relative;margin:0 0 14px}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.search input{width:100%;min-height:48px;padding:0 14px 0 42px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--chip);font-size:.875rem;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.rows{display:grid;grid-template-columns:minmax(0,1fr);column-gap:40px}
@media (min-width:820px){.rows{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.row a{display:block;text-decoration:none;min-width:0}
.row h3{font-size:1.25rem;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.meta{font:500 .72rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:500 .72rem var(--mono);padding:2px 8px;border-radius:4px;background:var(--chip);color:var(--muted)}
.empty{padding:48px 0 16px;max-width:460px}
.empty h2{font-size:1.7rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 20px}
.foot{margin:36px 0 0;font:500 .72rem var(--mono);letter-spacing:.04em;color:var(--muted)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-weight:600;color:var(--muted)}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:var(--ink)}
h1{font-size:clamp(2rem,6.5vw,3.1rem);line-height:1.04;letter-spacing:-.035em;font-weight:700}
.desc{color:var(--muted);max-width:60ch;margin:12px 0 0}
.stats{display:flex;flex-wrap:wrap;margin:22px 0 18px;border-block:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 24px 12px 0;margin-right:24px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0;margin-right:0}
.stat span{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 1.2rem/1.3 var(--display);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:1.2rem;line-height:1;cursor:pointer}
.stepper button:hover{border-color:var(--ink)}
.stepper output{min-width:2ch;text-align:center;font:700 1.2rem var(--display);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 28px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.confirm span{font-weight:600}
.grid{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}}
.label{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 8px}
.ings{list-style:none;margin:0;padding:0}
.ings li{border-bottom:1px dashed var(--line)}
.ings li:last-child{border-bottom:0}
.ing{display:grid;grid-template-columns:auto 5.6rem minmax(0,1fr) auto;gap:10px;align-items:baseline;min-height:44px;padding:9px 0;cursor:pointer}
.ing input{accent-color:var(--accent);width:18px;height:18px;margin:0;align-self:center}
.q{font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}
.t.wide{grid-column:2/4}
.ing.on .q,.ing.on .t{color:var(--muted);text-decoration:line-through}
.ings li.gh{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px;border-bottom:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:20px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;cursor:pointer}
.steps li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:600 .85rem var(--mono)}
.steps p{margin:3px 0 0;max-width:62ch}
.steps li.done p{color:var(--muted);text-decoration:line-through}
.notes{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);white-space:pre-line;max-width:62ch}

.paste{margin:12px 0 28px;padding:16px;border:1px dashed var(--line);border-radius:10px;display:grid;gap:10px;justify-items:start}
.paste textarea{width:100%}
.field{display:grid;gap:6px;margin-bottom:18px}
.field>span{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:16px;line-height:1.5}
textarea.f{resize:vertical}
.f:focus{border-color:var(--ink);outline:0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.ok{color:var(--muted);font-weight:500;margin:0}
form{max-width:640px}

.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cook-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress{height:4px;background:var(--chip);border-radius:2px;margin:10px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.cook-body{flex:1;overflow:auto;display:flex;align-items:center;padding:24px 0}
.cook-body.top{align-items:flex-start}
.cook-body .ings{width:100%;max-width:560px}
.cook-step{font:600 clamp(1.5rem,5.5vw,2.4rem)/1.3 var(--display);letter-spacing:-.01em;max-width:28ch;margin:0}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.cook-nav .btn{min-height:56px;font-size:1.05rem}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.bulk{margin-top:14px}.bulk summary{cursor:pointer;font-weight:600;padding:2px 0}
.tabs{flex-basis:100%;display:flex;gap:26px}
.tabs a{padding:10px 0 9px;margin-bottom:-1px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

.pill{display:inline-block;font:500 .68rem/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.pill.bad{color:var(--danger)}
.pill.warn{color:var(--warn)}
.pill.good{color:var(--good)}
.pill.mute{color:var(--muted)}
.st{align-self:center;font:500 .68rem var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.st.ok{color:var(--good)}
.st.short,.st.expired{color:var(--danger)}
.st.unk{color:var(--warn)}
.st.none{color:var(--muted)}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.duo>*{min-width:0}
.f[type="date"]{min-height:48px;appearance:none;-webkit-appearance:none}
select.f{min-height:48px}
.pform{margin:18px 0 8px;max-width:640px;padding-bottom:6px}
.sumline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 0}
.plist{list-style:none;margin:8px 0 0;padding:0}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.pi b{font:700 1.1rem/1.25 var(--display);letter-spacing:-.01em;margin-right:8px;overflow-wrap:anywhere}
.pi-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.pi .meta{margin-top:4px}
.pi-act{display:flex;gap:8px}
.pick{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);min-height:52px}
.pick label{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;min-width:0}
.pick input{accent-color:var(--accent);width:20px;height:20px;margin:0;flex:none}
.pick span{font-weight:600;overflow-wrap:anywhere}
.sv{display:flex;align-items:center;gap:6px}
.need{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--line)}
.need b{font-weight:600;overflow-wrap:anywhere}
.need .meta{grid-column:1/-1}
.sec{margin:30px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="#" aria-label="Mise, all recipes"><b>Mise</b><span class="count" id="count"></span></a>
    <a class="btn primary" id="addbtn" href="#add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add recipe</a>
    <nav class="tabs" aria-label="Sections"><a href="#" data-tab="list">Recipes</a><a href="#pantry" data-tab="pantry">Pantry</a><a href="#plan" data-tab="plan">Plan</a></nav>
  </header>
  <main>
    <section class="view" id="v-list">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search recipes, ingredients, tags" autocomplete="off" aria-label="Search recipes">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter recipes"></div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="empty" hidden></div>
    </section>
    <section class="view" id="v-detail" hidden></section>
    <section class="view" id="v-edit" hidden></section>
    <section class="view" id="v-backup" hidden></section>
    <section class="view" id="v-pantry" hidden>
      <h1>Pantry</h1>
      <p class="desc">What you have in, with the date you bought it. Items near their use-by date rise to the top.</p>
      <p class="ok" id="pantry-summary" style="margin-top:12px"></p>
      <form class="panel pform" id="pform" novalidate>
        <label class="field"><span>Item</span><input class="f" id="p-name" type="text" autocomplete="off" placeholder="Chicken thighs"></label>
        <div class="duo">
          <label class="field"><span>Amount</span><input class="f" id="p-qty" type="number" inputmode="decimal" step="any" min="0" placeholder="Optional"></label>
          <label class="field"><span>Unit</span><select class="f" id="p-unit">
            <option value="">Pieces</option><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option>
            <option value="tsp">tsp</option><option value="tbsp">tbsp</option><option value="cup">cup</option><option value="oz">oz</option><option value="lb">lb</option>
          </select></label>
        </div>
        <div class="duo">
          <label class="field"><span>Bought</span><input class="f" id="p-bought" type="date"></label>
          <label class="field"><span>Use by (optional)</span><input class="f" id="p-useby" type="date"></label>
        </div>
        <p class="err" id="p-err" role="alert" hidden></p>
        <div class="actions" style="margin:0"><button class="btn primary" type="submit" id="p-save">Add to pantry</button><button class="btn" type="button" id="p-cancel" hidden>Cancel</button></div>
      </form>
      <details class="panel bulk" id="p-bulkbox">
        <summary>Add many at once</summary>
        <p class="hint" style="margin:10px 0">One item per line. Amount can go before or after the name. Optional dates after a semicolon.</p>
        <textarea class="f" id="p-bulk" rows="7" aria-label="Pantry items, one per line" placeholder="Chicken thighs 775 g; bought 25 Oct; use by 30 Oct&#10;Rice 10 kg&#10;Eggs 30&#10;Salt"></textarea>
        <p class="err" id="p-bulk-note" role="status" hidden></p>
        <div class="actions" style="margin:12px 0 0"><button class="btn primary" type="button" id="p-bulk-go">Add all</button></div>
      </details>
      <div id="pantry-list"></div>
    </section>
    <section class="view" id="v-plan" hidden></section>
  </main>
  <p class="foot" id="foot"></p>
</div>
<div class="cook" id="cook" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* LOGIC START */
const FR = {'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
const FRCH = Object.keys(FR).join('');
const NUM = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?\\s*[' + FRCH + ']|\\d+(?:[.,]\\d+)?|[' + FRCH + '])';
const UNIT = '(?:kg|g|mg|ml|l|litres?|liters?|tsp|tbsp|cups?|oz|lbs?|pints?)';
const LEAD = new RegExp('^(\\s*)(' + NUM + ')(?:\\s*(?:-|–|—|to)\\s*(' + NUM + '))?(?:\\s*(' + UNIT + ')\\b)?\\.?\\s*', 'i');
const GLYPH = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'k'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}

function toNum(s){
  s = String(s).trim().replace(',', '.');
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if ((m = s.match(new RegExp('^(\\d+(?:\\.\\d+)?)\\s*([' + FRCH + '])$')))) return parseFloat(m[1]) + FR[m[2]];
  if ((m = s.match(new RegExp('^([' + FRCH + '])$')))) return FR[m[1]];
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmtQty(n){
  if (!isFinite(n) || n <= 0) return '0';
  if (n >= 10) return String(Math.round(n * 10) / 10);
  const whole = Math.floor(n), frac = n - whole;
  let bi = 0, bd = 9;
  GLYPH.forEach(([v], i) => { const d = Math.abs(frac - v); if (d < bd) { bd = d; bi = i; } });
  if (bd < 0.04) {
    const [v, g] = GLYPH[bi];
    const w = whole + (v === 1 ? 1 : 0);
    if (w || g) return (w ? String(w) : '') + g;
  }
  return String(Math.round(n * 100) / 100);
}

function splitLine(line, f){
  const m = String(line).match(LEAD);
  if (!m) return {qty:'', rest:String(line).trim()};
  const a = toNum(m[2]);
  if (a === null) return {qty:'', rest:String(line).trim()};
  const b = m[3] ? toNum(m[3]) : null;
  let q = fmtQty(a * f);
  if (b !== null) q += '–' + fmtQty(b * f);
  if (m[4]) q += ' ' + m[4];
  return {qty:q, rest:String(line).slice(m[0].length).trim()};
}

function parseMins(s){
  const re = /(\d+(?:[.,]\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/gi;
  let t = 0, any = false, m;

  if (!seeded && !state.recipes.length) {
    const t = Date.now();
    state.recipes = EXAMPLES.map((x, i) => Object.assign({}, x, {example:true, fav:false, created:t - i * 1000, updated:t - i * 1000}));
    try { lsSave(); } catch (e) {}
  }
  if (!pseeded && !state.pantry.length) {
    const rel = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    state.pantry = [
      ['Chicken thighs', 6, '', -4, 1], ['Broccoli', 1, '', -2, 2], ['Stir fry veg', 400, 'g', -2, 2], ['Eggs', 4, '', -8, -1],
      ['Red lentils', 500, 'g', -60, null], ['Olive oil', 500, 'ml', -30, null], ['Garlic', 2, '', -5, null], ['Onions', 3, '', -6, null]
    ].map((x, i) => ({id:'pex' + i, name:x[0], qty:x[1], unit:x[2], bought:rel(x[3]), useBy:x[4] == null ? '' : rel(x[4]), example:true}));
    try { lsSavePantry(); } catch (e) {}
  }
  try { localStorage.setItem(SEED_KEY, '1'); localStorage.setItem(PSEED_KEY, '1'); } catch (e) {}
  sortRecipes();
  state.ready = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  render();
}

let toastT;

async function copyText(text){

  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }
    catch (e2) { return false; }
  }
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.replace(/^#/, ''); let m;
  if (h === 'add') return {v:'edit', id:null};
  if (h === 'backup') return {v:'backup'};
  if (h === 'pantry') return {v:'pantry'};
  if (h === 'plan') return {v:'plan'};
  if ((m = h.match(/^edit-(.+)$/))) return {v:'edit', id:m[1]};
  if ((m = h.match(/^r-(.+)$/))) return {v:'detail', id:m[1]};
  return {v:'list'};
}
const VIEWS = ['list','detail','edit','pantry','plan','backup'];
function render(){
  const r = route();
  VIEWS.forEach(v => { $('#v-' + v).hidden = r.v !== v; });
  $('#addbtn').hidden = r.v !== 'list';
  document.querySelectorAll('.tabs a').forEach(a => {
    if (a.dataset.tab === (r.v === 'detail' || r.v === 'edit' ? 'list' : r.v)) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (r.v !== 'edit') state.editKey = null;
  if (r.v !== 'detail') state.servingsFor = null;
  if (r.v === 'list') renderList(); else if (r.v === 'detail') renderDetail(r.id); else if (r.v === 'pantry') renderPantry(); else if (r.v === 'plan') renderPlan(); else if (r.v === 'backup') renderBackup(); else renderEdit(r.id);
  renderCook();
  $('#foot').innerHTML = (r.v === 'list' || r.v === 'pantry' || r.v === 'plan') && state.ready ? 'Saved on this device. <a href="#backup">Back up or restore</a>' : '';
}

/* ---------- library ---------- */
function rowHtml(r){
  const bits = [];
  const t = (r.prep || 0) + (r.cook || 0);
  if (t) bits.push(fmtMins(t));
  if (r.serves) bits.push('Serves ' + r.serves);
  const n = (r.ingredients || []).filter(l => !l.startsWith('# ')).length;
  if (n) bits.push(n + ' ingredients');
  if (state.pantry.length) { const rs = recipeStock(r, state.pantry, todayStr()); if (rs.total) bits.push(rs.have + '/' + rs.total + ' in stock'); }
  if (r.example) bits.push('Example');
  const tags = (r.tags || []).length ? '<div class="tags">' + r.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '';
  return '<div class="row"><a href="#r-' + esc(r.id) + '"><h3>' + esc(r.title) + '</h3><div class="meta">' + esc(bits.join(' · ')) + '</div>' + tags + '</a>' +
    '<button class="icon star" type="button" data-fav="' + esc(r.id) + '" aria-pressed="' + !!r.fav + '" aria-label="' + (r.fav ? 'Remove from favourites' : 'Add to favourites') + '">' + STAR + '</button></div>';

function renderList(){
  const rows = $('#rows'), chips = $('#chips'), empty = $('#empty');
  const all = state.recipes;
  $('#count').textContent = state.ready && all.length ? all.length + (all.length === 1 ? ' recipe' : ' recipes') : '';
  const counts = {};
  all.forEach(r => (r.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
  const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).slice(0, 14);
  const items = [['all', 'All']];
  if (all.some(r => r.fav)) items.push(['fav', 'Favourites']);
  if (state.pantry.length && all.some(r => { const s = recipeStock(r, state.pantry, todayStr()); return s.total && s.have === s.total; })) items.push(['ready', 'Ready to cook']);
  tags.forEach(t => items.push(['t:' + t, t]));
  if (!items.some(i => i[0] === state.filter)) state.filter = 'all';
  chips.hidden = !all.length;
  chips.innerHTML = all.length ? items.map(([k, l]) => '<button class="chip" type="button" data-f="' + esc(k) + '" aria-pressed="' + (state.filter === k) + '">' + esc(l) + '</button>').join('') : '';
  if (!state.ready) { rows.innerHTML = ''; empty.hidden = false; empty.innerHTML = '<p>Loading your recipes…</p>'; return; }
  if (!all.length) {
    rows.innerHTML = ''; empty.hidden = false;
    empty.innerHTML = '<h2>Your recipe book is empty</h2><p>Paste a recipe from Claude and the title, ingredients and method are filled in for you.</p><a class="btn primary" href="#add">Add your first recipe</a>';
    return;
  }
  const q = state.q.trim().toLowerCase();
  const list = all.filter(r => {
    if (state.filter === 'fav' && !r.fav) return false;
    if (state.filter === 'ready') { const s = recipeStock(r, state.pantry, todayStr()); if (!s.total || s.have !== s.total) return false; }
    if (state.filter.startsWith('t:') && !(r.tags || []).includes(state.filter.slice(2))) return false;
    if (!q) return true;
    const hay = [r.title, r.description, (r.tags || []).join(' '), (r.ingredients || []).join(' ')].join(' ').toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  });
  if (!list.length) {
    rows.innerHTML = ''; empty.hidden = false;
    empty.innerHTML = '<h2>No matches</h2><p>Nothing in your book fits that search or filter.</p><button class="btn" type="button" data-clear="1">Clear search</button>';
    return;
  }
  empty.hidden = true;
  rows.innerHTML = list.map(rowHtml).join('');
}

/* ---------- recipe page ---------- */
function renderDetail(id){
  const el = $('#v-detail');

  if (!r) {
    el.innerHTML = '<a class="back" href="#">' + BACK + 'All recipes</a><div class="empty"><p>' + (state.ready ? 'That recipe is not in your book.' : 'Loading…') + '</p></div>';
    return;
  }
  if (state.servingsFor !== id) { state.servingsFor = id; state.servings = r.serves || 0; state.checked = new Set(); state.done = new Set(); state.confirmDel = false; }
  const base = r.serves || 0, f = base ? state.servings / base : 1;
  const stats = [];
  if (r.prep) stats.push('<div class="stat"><span>Prep</span><b>' + esc(fmtMins(r.prep)) + '</b></div>');
  if (r.cook) stats.push('<div class="stat"><span>Cook</span><b>' + esc(fmtMins(r.cook)) + '</b></div>');
  if (base) stats.push('<div class="stat"><span>Serves</span><div class="stepper"><button type="button" data-sv="-1" aria-label="Fewer servings">−</button><output>' + state.servings + '</output><button type="button" data-sv="1" aria-label="More servings">+</button></div></div>');

  const actions = state.confirmDel
    ? '<div class="actions confirm"><span>Delete this recipe?</span><button class="btn danger" type="button" data-a="delyes">Delete</button><button class="btn" type="button" data-a="delno">Keep it</button></div>'
    : '<div class="actions"><button class="btn primary" type="button" data-a="cook">Start cooking</button><a class="btn" href="#edit-' + esc(id) + '">Edit</a><button class="btn" type="button" data-a="copy">Copy</button><button class="btn danger" type="button" data-a="del">Delete</button></div>';
  const hasStock = state.pantry.length > 0, today = todayStr();
  let nHave = 0, nTotal = 0;
  const ings = (r.ingredients || []).map((l, i) => {
    if (l.startsWith('# ')) return '<li class="gh">' + esc(l.slice(2)) + '</li>';
    const s = splitLine(l, f), on = state.checked.has(i);
    let tag = '';
    if (hasStock) {
      const p = parseIng(l);
      if (p.key) {
        const sf = stockFor(p, p.base == null ? null : p.base * f, state.pantry, today), lab = stockLabel(p, sf);
        nTotal++; if (sf.st === 'ok' || sf.st === 'unk') nHave++;
        tag = '<span class="st ' + lab.cls + '">' + esc(lab.text) + '</span>';
      }
    }
    return '<li><label class="ing' + (on ? ' on' : '') + '"><input type="checkbox" data-ing="' + i + '"' + (on ? ' checked' : '') + '>' +
      (s.qty ? '<span class="q">' + esc(s.qty) + '</span><span class="t">' : '<span class="t wide">') + esc(s.rest) + '</span>' + tag + '</label></li>';
  }).join('');
  const stockLine = hasStock && nTotal ? '<p class="hint" style="margin:0 0 10px">You have ' + nHave + ' of ' + nTotal + ' ingredients.</p>' : '';
  const steps = (r.steps || []).map((s, i) => '<li data-step="' + i + '"' + (state.done.has(i) ? ' class="done"' : '') + '><p>' + esc(s) + '</p></li>').join('');
  el.innerHTML =
    '<div class="bar"><a class="back" href="#">' + BACK + 'All recipes</a><button class="icon star" type="button" data-fav="' + esc(id) + '" aria-pressed="' + !!r.fav + '" aria-label="' + (r.fav ? 'Remove from favourites' : 'Add to favourites') + '">' + STAR + '</button></div>' +
    '<h1>' + esc(r.title) + '</h1>' + (r.description ? '<p class="desc">' + esc(r.description) + '</p>' : '') +
    (stats.length ? '<div class="stats">' + stats.join('') + '</div>' : '') + scaled + actions +
    '<div class="grid"><section><p class="label">Ingredients</p>' + stockLine + '<div class="panel">' + (ings ? '<ul class="ings">' + ings + '</ul>' : '<p class="hint">No ingredients yet.</p>') + '</div></section>' +
    '<section><p class="label">Method</p>' + (steps ? '<ol class="steps">' + steps + '</ol>' : '<p class="hint">No method written yet.</p>') +
    (r.notes ? '<div class="notes">' + esc(r.notes) + '</div>' : '') + '</section></div>';
}

/* ---------- plan ---------- */
function needRow(e){
  const s = e.s;
  let status, cls;
  if (s.st === 'ok') { status = 'In stock'; cls = 'good'; }
  else if (s.st === 'unk') { status = 'Check'; cls = 'warn'; }
  else if (s.st === 'short') { status = 'Buy ' + fmtAmount(s.short, e.fam, e.unit); cls = 'bad'; }
  else { status = e.base != null ? 'Buy ' + fmtAmount(e.base, e.fam, e.unit) : 'Buy'; cls = 'bad'; }
  const need = e.base != null ? 'Need ' + fmtAmount(e.base, e.fam, e.unit) : 'To taste';
  const have = s.st === 'none' ? 'have none' : s.st === 'expired' ? 'past use-by' : s.have != null ? 'have ' + fmtAmount(s.have, e.fam, e.unit) : s.st === 'unk' ? 'have some, amount unclear' : 'have it';
  return '<li class="need"><b>' + esc(e.name) + '</b><span class="pill ' + cls + '">' + esc(status) + '</span><div class="meta">' + esc(need + ' · ' + have + ' · ' + e.recipes.join(', ')) + '</div></li>';
}
function renderPlan(){
  const el = $('#v-plan');
  if (!state.ready) { el.innerHTML = '<h1>Plan</h1><p class="desc">Loading…</p>'; return; }
  if (!state.recipes.length) { el.innerHTML = '<h1>Plan</h1><div class="empty"><h2>No recipes to plan with</h2><p>Add a recipe first, then pick it here.</p><a class="btn primary" href="#add">Add a recipe</a></div>'; return; }
  const today = todayStr();
  Object.keys(state.plan).forEach(id => { if (!state.recipes.some(r => r.id === id)) delete state.plan[id]; });
  const picks = state.recipes.map(r => {
    const n = state.plan[r.id], id = esc(r.id);
    return '<li class="pick"><label><input type="checkbox" data-pick="' + id + '"' + (n ? ' checked' : '') + '><span>' + esc(r.title) + '</span></label>' +
      (n ? '<div class="sv"><div class="stepper"><button type="button" data-pd="-1" data-id="' + id + '" aria-label="Fewer">−</button><output>' + n + '</output><button type="button" data-pd="1" data-id="' + id + '" aria-label="More">+</button></div>' +
        '<button class="btn sm" type="button" data-pd="x2" data-id="' + id + '" aria-label="Double it">×2</button></div>' : '') + '</li>';
  }).join('');
  const entries = aggregatePlan(state.recipes, state.plan);
  entries.forEach(e => { e.s = stockFor(e, e.base, state.pantry, today); });
  const buy = entries.filter(e => e.s.st === 'none' || e.s.st === 'expired' || e.s.st === 'short');
  const check = entries.filter(e => e.s.st === 'unk'), have = entries.filter(e => e.s.st === 'ok');
  state.planBuy = buy;
  const sec = (t, n, extra) => '<div class="sec"><p class="label" style="margin:0">' + t + ' (' + n + ')</p>' + (extra || '') + '</div>';
  let out = '<h1>Plan</h1><p class="desc">Tick what you are cooking and set the servings. You get the combined ingredients, what you already have, and what to buy. Recipes with no serving count are counted in batches.</p>' +
    '<p class="label" style="margin:22px 0 0">Cooking</p><ul class="plist" style="margin-top:4px">' + picks + '</ul>';
  if (!entries.length) out += '<p class="hint" style="margin-top:20px">Tick one or more recipes to see what you need.</p>';
  else {
    out += sec('To buy', buy.length, buy.length ? '<button class="btn sm" type="button" data-plan="copy">Copy list</button>' : '');
    out += buy.length ? '<ul class="plist">' + buy.map(needRow).join('') + '</ul>' : '<p class="hint">You already have everything.</p>';
    if (check.length) out += sec('Check you have enough', check.length) + '<ul class="plist">' + check.map(needRow).join('') + '</ul>';
    if (have.length) out += sec('Already in stock', have.length) + '<ul class="plist">' + have.map(needRow).join('') + '</ul>';
  }
  el.innerHTML = out;
}
$('#v-plan').addEventListener('change', e => {
  const c = e.target.closest('[data-pick]');
  if (!c) return;
  const r = state.recipes.find(x => x.id === c.dataset.pick);
  if (!r) return;
  if (c.checked) state.plan[r.id] = r.serves || 1; else delete state.plan[r.id];
  lsSavePlan(); renderPlan();
});
$('#v-plan').addEventListener('click', async e => {
  const d = e.target.closest('[data-pd]');
  if (d) {
    const id = d.dataset.id, cur = state.plan[id] || 1, a = d.dataset.pd;
    state.plan[id] = Math.min(999, a === 'x2' ? cur * 2 : Math.max(1, cur + (+a)));
    lsSavePlan(); renderPlan(); return;
  }
  if (e.target.closest('[data-plan="copy"]')) {
    const text = 'Shopping list\n' + state.planBuy.map(x => '- ' + planBuyLine(x)).join('\n');
    toast((await copyText(text)) ? 'List copied' : 'Could not copy');
  }
});

/* ---------- add / edit ---------- */
function renderEdit(id){
  const key = id || 'new';
  if (state.editKey === key) return;
  const el = $('#v-edit');
  const r = id ? state.recipes.find(x => x.id === id) : null;
  const backHref = id ? '#r-' + esc(id) : '#';
  if (id && !r) {
    el.innerHTML = '<a class="back" href="#">' + BACK + 'All recipes</a><div class="empty"><p>' + (state.ready ? 'That recipe is not in your book.' : 'Loading…') + '</p></div>';
    return;
  }
  state.editKey = key;
  const v = r || {title:'', description:'', serves:0, prep:0, cook:0, tags:[], ingredients:[], steps:[], notes:''};
  const paste = id ? '' :
    '<div class="paste"><p class="label" style="margin:0">Paste a recipe</p>' +
    '<p class="hint">Copy a recipe from Claude and paste it here. The title, times, ingredients and method are picked out for you.</p>' +
    '<textarea class="f" id="paste" rows="6" aria-label="Recipe text to paste" placeholder="Paste the whole recipe here"></textarea>' +
    '<button class="btn" type="button" id="parsebtn">Fill in the form</button><p class="ok" id="parsenote" role="status" hidden></p></div>';
  el.innerHTML =
    '<div class="bar"><a class="back" href="' + backHref + '">' + BACK + 'Cancel</a></div>' +
    '<h1>' + (id ? 'Edit recipe' : 'New recipe') + '</h1>' + paste +
    '<form id="form" novalidate style="margin-top:22px">' +
    '<label class="field"><span>Title</span><input class="f" id="f-title" type="text" autocomplete="off" value="' + esc(v.title) + '"></label>' +
    '<label class="field"><span>Short description</span><input class="f" id="f-desc" type="text" autocomplete="off" value="' + esc(v.description) + '"></label>' +
    '<div class="trio">' +
    '<label class="field"><span>Serves</span><input class="f" id="f-serves" type="number" inputmode="numeric" min="0" max="99" value="' + (v.serves || '') + '"></label>' +
    '<label class="field"><span>Prep (min)</span><input class="f" id="f-prep" type="number" inputmode="numeric" min="0" value="' + (v.prep || '') + '"></label>' +
    '<label class="field"><span>Cook (min)</span><input class="f" id="f-cook" type="number" inputmode="numeric" min="0" value="' + (v.cook || '') + '"></label></div>' +
    '<label class="field"><span>Tags</span><input class="f" id="f-tags" type="text" autocomplete="off" placeholder="dinner, quick, curry" value="' + esc((v.tags || []).join(', ')) + '"></label>' +
    '<label class="field"><span>Ingredients</span><textarea class="f" id="f-ings" rows="9" placeholder="400g chicken thighs&#10;2 tbsp olive oil">' + esc((v.ingredients || []).join('\n')) + '</textarea>' +
    '<p class="hint">One per line. Start a line with # for a group heading, like # For the sauce. Quantities at the start of a line scale with servings.</p></label>' +
    '<label class="field"><span>Method</span><textarea class="f" id="f-steps" rows="9" placeholder="Heat the oven to 200°C.&#10;Roast for 45 minutes.">' + esc((v.steps || []).join('\n')) + '</textarea>' +
    '<p class="hint">One step per line.</p></label>' +
    '<label class="field"><span>Notes</span><textarea class="f" id="f-notes" rows="3">' + esc(v.notes || '') + '</textarea></label>' +
    '<p class="err" id="formerr" role="alert" hidden></p>' +
    '<div class="actions"><button class="btn primary" type="submit" id="savebtn">Save recipe</button><a class="btn" href="' + backHref + '">Cancel</a></div></form>';
}
function fillFromPaste(){
  const txt = $('#paste').value, note = $('#parsenote');
  const p = parseRecipeText(txt);
  note.hidden = false;
  if (!txt.trim() || (!p.title && !p.ingredients.length && !p.steps.length)) { note.className = 'err'; note.textContent = 'Nothing to read yet. Paste a recipe first.'; return; }
  const set = (sel, val) => { $(sel).value = val; };
  if (p.title) set('#f-title', p.title);
  if (p.description) set('#f-desc', p.description);
  if (p.serves) set('#f-serves', p.serves);
  if (p.prep) set('#f-prep', p.prep);
  if (p.cook) set('#f-cook', p.cook);
  if (p.tags.length) set('#f-tags', p.tags.join(', '));
  if (p.ingredients.length) set('#f-ings', p.ingredients.join('\n'));
  if (p.steps.length) set('#f-steps', p.steps.join('\n'));
  if (p.notes) set('#f-notes', p.notes);
  note.className = 'ok';
  note.textContent = 'Filled in below. Check it over, then save.';
  $('#f-title').scrollIntoView({behavior:'smooth', block:'center'});
}
async function saveForm(){
  const id = route().id, err = $('#formerr'), btn = $('#savebtn');
  const fail = msg => { err.textContent = msg; err.hidden = false; };
  err.hidden = true;
  if (!state.ready) { fail('Still connecting to your recipe book. Try again in a moment.'); return; }
  const lines = (val, re) => val.split('\n').map(s => s.trim().replace(re, '')).filter(Boolean);
  const title = $('#f-title').value.trim();
  const ingredients = lines($('#f-ings').value, /^[-*•–]\s+/);
  const steps = lines($('#f-steps').value, /^(?:[-*•–]\s+|\d+[.)]\s*)/);
  if (!title) { fail('Give the recipe a title.'); $('#f-title').focus(); return; }
  if (!ingredients.length && !steps.length) { fail('Add some ingredients or steps first.'); return; }
  const num = (sel, max) => Math.min(max, Math.max(0, parseInt($(sel).value, 10) || 0));
  const tags = [];
  $('#f-tags').value.split(/[,#]/).map(s => s.trim().toLowerCase()).filter(Boolean).forEach(t => { if (!tags.includes(t)) tags.push(t); });
  let r = id ? state.recipes.find(x => x.id === id) : null;
  if (!r) r = {id:uid(), created:Date.now(), fav:false};
  Object.assign(r, {title, description:$('#f-desc').value.trim(), serves:num('#f-serves', 99), prep:num('#f-prep', 9999), cook:num('#f-cook', 9999), tags, ingredients, steps, notes:$('#f-notes').value.trim(), example:false});
  btn.disabled = true;
  try { await persist(r); location.hash = 'r-' + r.id; }
  catch (e) { fail('Could not save. Your browser may be blocking storage.'); btn.disabled = false; }
}
$('#v-edit').addEventListener('click', e => { if (e.target.closest('#parsebtn')) fillFromPaste(); });
$('#v-edit').addEventListener('submit', e => { e.preventDefault(); saveForm(); });

/* ---------- backup ---------- */
function backupJson(){
  return JSON.stringify({app:'mise', version:1, exported:new Date().toISOString(), recipes:state.recipes.map(r => Object.assign({id:r.id}, clean(r))), pantry:state.pantry.map(cleanItem)}, null, 1);
}
function renderBackup(){
  const n = state.recipes.length;
  $('#v-backup').innerHTML =
    '<div class="bar"><a class="back" href="#">' + BACK + 'All recipes</a></div><h1>Backup</h1>' +
    '<p class="desc">Your recipes and pantry live only on this device. Copy a backup now and then and keep it somewhere safe, like Notes.</p>' +
    '<div class="actions" style="margin-top:20px"><button class="btn primary" type="button" data-b="copy">Copy backup (' + n + (n === 1 ? ' recipe' : ' recipes') + ')</button>' +
    (navigator.share ? '<button class="btn" type="button" data-b="share">Share\u2026</button>' : '') + '</div>' +
    '<p class="label" style="margin-top:28px">Restore</p><p class="hint" style="margin-bottom:10px">Paste a backup below. Recipes and pantry items with the same id are replaced and the rest are added.</p>' +
    '<textarea class="f" id="restore" rows="6" aria-label="Backup text to restore" placeholder="Paste a backup here"></textarea>' +
    '<div class="actions" style="margin-top:12px"><button class="btn" type="button" data-b="restore">Restore</button></div><p class="ok" id="restorenote" role="status" hidden></p>';
}
$('#v-backup').addEventListener('click', async e => {
  const b = e.target.closest('[data-b]');
  if (!b) return;
  const a = b.dataset.b;
  if (a === 'copy') toast((await copyText(backupJson())) ? 'Backup copied' : 'Could not copy');
  else if (a === 'share') { try { await navigator.share({title:'Mise backup', text:backupJson()}); } catch (err) {} }
  else if (a === 'restore') {
    const note = $('#restorenote');
    note.hidden = false;
    let data;
    try { data = JSON.parse($('#restore').value); } catch (err) { note.className = 'err'; note.textContent = 'That is not a Mise backup.'; return; }
    const list = data && data.app === 'mise' ? (Array.isArray(data.recipes) ? data.recipes.filter(r => r && r.title && String(r.id || '').replace(/[^A-Za-z0-9_-]/g, '')) : []) : null;
    const plist = data && data.app === 'mise' && Array.isArray(data.pantry) ? data.pantry.filter(x => x && x.name) : [];
    if (!list || (!list.length && !plist.length)) { note.className = 'err'; note.textContent = 'Nothing to restore in that text.'; return; }
    list.forEach(r => {
      const rec = Object.assign({id:String(r.id).replace(/[^A-Za-z0-9_-]/g, '')}, clean(r));
      const i = state.recipes.findIndex(x => x.id === rec.id);
      if (i >= 0) state.recipes[i] = rec; else state.recipes.push(rec);
    });
    plist.forEach(x => {
      const it = Object.assign(cleanItem(x), {id:String(x.id || uid()).replace(/[^A-Za-z0-9_-]/g, '') || uid()});
      const i = state.pantry.findIndex(y => y.id === it.id);
      if (i >= 0) state.pantry[i] = it; else state.pantry.push(it);
    });
    sortRecipes();
    try { lsSave(); lsSavePantry(); } catch (err) { note.className = 'err'; note.textContent = 'Could not save. Your browser may be blocking storage.'; return; }
    note.className = 'ok';
    note.textContent = 'Restored ' + [list.length ? list.length + (list.length === 1 ? ' recipe' : ' recipes') : '', plist.length ? plist.length + (plist.length === 1 ? ' pantry item' : ' pantry items') : ''].filter(Boolean).join(' and ') + '.';
    $('#restore').value = '';
  }
});

/* ---------- cook mode ---------- */
let wake = null;
async function lockWake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
function unlockWake(){ try { if (wake) wake.release(); } catch (e) {} wake = null; }
function openCook(r){ state.cook = {id:r.id, i:0, ing:false, f:r.serves ? state.servings / r.serves : 1}; lockWake(); renderCook(); }
function closeCook(){ state.cook = null; unlockWake(); renderCook(); }
function stepCook(d){
  const c = state.cook;
  if (!c) return;
  const r = state.recipes.find(x => x.id === c.id);
  const n = Math.max(1, ((r && r.steps) || []).length);
  if (d > 0 && c.i >= n - 1) { closeCook(); toast('Enjoy your meal'); return; }
  c.i = Math.min(n - 1, Math.max(0, c.i + d));
  c.ing = false;
  renderCook();
}
function renderCook(){
  const el = $('#cook'), c = state.cook;
  if (!c) { el.hidden = true; el.innerHTML = ''; return; }
  const r = state.recipes.find(x => x.id === c.id);
  if (!r) { state.cook = null; unlockWake(); el.hidden = true; el.innerHTML = ''; return; }
  const steps = (r.steps && r.steps.length) ? r.steps : ['No method written yet. Close this and use Edit to add steps.'];
  const n = steps.length;
  let body;
  if (c.ing) {
    body = '<div class="cook-body top"><ul class="ings">' + (r.ingredients || []).map(l => {
      if (l.startsWith('# ')) return '<li class="gh">' + esc(l.slice(2)) + '</li>';
      const s = splitLine(l, c.f);
      return '<li><div class="ing" style="grid-template-columns:5.6rem minmax(0,1fr)">' + (s.qty ? '<span class="q">' + esc(s.qty) + '</span><span class="t">' : '<span class="t wide">') + esc(s.rest) + '</span></div></li>';
    }).join('') + '</ul></div>';
  } else {
    body = '<div class="cook-body"><p class="cook-step">' + esc(steps[c.i]) + '</p></div>';
  }
  el.hidden = false;
  el.innerHTML =
    '<div class="cook-top"><button class="icon" type="button" data-c="close" aria-label="Close cooking mode">' + CLOSE + '</button>' +
    '<div class="meta">Step ' + (c.i + 1) + ' of ' + n + '</div>' +
    '<button class="btn sm" type="button" data-c="ing" aria-pressed="' + c.ing + '">Ingredients</button></div>' +
    '<div class="progress"><i style="width:' + ((c.i + 1) / n * 100) + '%"></i></div>' + body +
    '<div class="cook-nav"><button class="btn" type="button" data-c="prev"' + (c.i === 0 ? ' disabled' : '') + '>Back</button>' +
    '<button class="btn primary" type="button" data-c="next">' + (c.i >= n - 1 ? 'Done' : 'Next step') + '</button></div>';
}
$('#cook').addEventListener('click', e => {
  const b = e.target.closest('[data-c]');
  if (!b || !state.cook) return;
  const a = b.dataset.c;
  if (a === 'close') closeCook();
  else if (a === 'ing') { state.cook.ing = !state.cook.ing; renderCook(); }
  else if (a === 'prev') stepCook(-1);
  else if (a === 'next') stepCook(1);
});
document.addEventListener('keydown', e => {
  if (!state.cook) return;
  if (e.key === 'ArrowRight') stepCook(1);
  else if (e.key === 'ArrowLeft') stepCook(-1);
  else if (e.key === 'Escape') closeCook();
});
document.addEventListener('visibilitychange', () => { if (state.cook && document.visibilityState === 'visible') lockWake(); });

/* ---------- start ---------- */
window.addEventListener('hashchange', () => {
  state.confirmDel = false; state.cook = null; unlockWake();
  window.scrollTo(0, 0);
  render();
});
render();
initStore();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
