<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EDF1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mise">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
a,button{touch-action:manipulation}
:root{
  /* Layout: one centred column. Library rows split by hairlines; a recipe splits into ingredients | method on wide screens. */
  --bg:#EDF1EB; --surface:#F7F9F5; --ink:#14302A; --muted:#566B63; --line:#CFD8CE; --chip:#E0E8DE;
  --accent:#E8A91A; --on-accent:#1B1405; --danger:#B03A2E;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0D1714;--surface:#14231F;--ink:#E6EFE8;--muted:#8FA79C;--line:#25362F;--chip:#1C2D27;--accent:#F0B93A;--on-accent:#1B1405;--danger:#EC7B6F;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0D1714;--surface:#14231F;--ink:#E6EFE8;--muted:#8FA79C;--line:#25362F;--chip:#1C2D27;--accent:#F0B93A;--on-accent:#1B1405;--danger:#EC7B6F;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:baseline;gap:12px;text-decoration:none;min-width:0}
.mark b{font:700 1.75rem/1 var(--display);letter-spacing:-.03em}
.count{font:500 .72rem var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.view{padding-top:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:transparent;font-weight:600;text-decoration:none;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem}
.btn[disabled]{opacity:.35;cursor:default}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--ink)}
.icon:hover{background:var(--chip)}
.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.star[aria-pressed="true"] svg{fill:var(--accent)}

.search{position:relative;margin:0 0 14px}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.search input{width:100%;min-height:48px;padding:0 14px 0 42px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--chip);font-size:.875rem;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.rows{display:grid;grid-template-columns:minmax(0,1fr);column-gap:40px}
@media (min-width:820px){.rows{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.row a{display:block;text-decoration:none;min-width:0}
.row h3{font-size:1.25rem;line-height:1.2;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.meta{font:500 .72rem/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:500 .72rem var(--mono);padding:2px 8px;border-radius:4px;background:var(--chip);color:var(--muted)}
.empty{padding:48px 0 16px;max-width:460px}
.empty h2{font-size:1.7rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 20px}
.foot{margin:36px 0 0;font:500 .72rem var(--mono);letter-spacing:.04em;color:var(--muted)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none;font-weight:600;color:var(--muted)}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{color:var(--ink)}
h1{font-size:clamp(2rem,6.5vw,3.1rem);line-height:1.04;letter-spacing:-.035em;font-weight:700}
.desc{color:var(--muted);max-width:60ch;margin:12px 0 0}
.stats{display:flex;flex-wrap:wrap;margin:22px 0 18px;border-block:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 24px 12px 0;margin-right:24px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0;margin-right:0}
.stat span{font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:700 1.2rem/1.3 var(--display);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:1.2rem;line-height:1;cursor:pointer}
.stepper button:hover{border-color:var(--ink)}
.stepper output{min-width:2ch;text-align:center;font:700 1.2rem var(--display);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 28px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.confirm span{font-weight:600}
.grid{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}}
.label{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 8px}
.ings{list-style:none;margin:0;padding:0}
.ings li{border-bottom:1px dashed var(--line)}
.ings li:last-child{border-bottom:0}
.ing{display:grid;grid-template-columns:auto 5.6rem minmax(0,1fr);gap:10px;align-items:baseline;min-height:44px;padding:9px 0;cursor:pointer}
.ing input{accent-color:var(--accent);width:18px;height:18px;margin:0;align-self:center}
.q{font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}
.t.wide{grid-column:2/-1}
.ing.on .q,.ing.on .t{color:var(--muted);text-decoration:line-through}
.ings li.gh{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px;border-bottom:0}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:20px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;cursor:pointer}
.steps li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:600 .85rem var(--mono)}
.steps p{margin:3px 0 0;max-width:62ch}
.steps li.done p{color:var(--muted);text-decoration:line-through}
.notes{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);white-space:pre-line;max-width:62ch}

.paste{margin:12px 0 28px;padding:16px;border:1px dashed var(--line);border-radius:10px;display:grid;gap:10px;justify-items:start}
.paste textarea{width:100%}
.field{display:grid;gap:6px;margin-bottom:18px}
.field>span{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:16px;line-height:1.5}
textarea.f{resize:vertical}
.f:focus{border-color:var(--ink);outline:0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.ok{color:var(--muted);font-weight:500;margin:0}
form{max-width:640px}

.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cook-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress{height:4px;background:var(--chip);border-radius:2px;margin:10px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.cook-body{flex:1;overflow:auto;display:flex;align-items:center;padding:24px 0}
.cook-body.top{align-items:flex-start}
.cook-body .ings{width:100%;max-width:560px}
.cook-step{font:600 clamp(1.5rem,5.5vw,2.4rem)/1.3 var(--display);letter-spacing:-.01em;max-width:28ch;margin:0}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.cook-nav .btn{min-height:56px;font-size:1.05rem}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="#" aria-label="Mise, all recipes"><b>Mise</b><span class="count" id="count"></span></a>
    <a class="btn primary" id="addbtn" href="#add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add recipe</a>
  </header>
  <main>
    <section class="view" id="v-list">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search recipes, ingredients, tags" autocomplete="off" aria-label="Search recipes">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter recipes"></div>
      <div class="rows" id="rows"></div>
      <div class="empty" id="empty" hidden></div>
    </section>
    <section class="view" id="v-detail" hidden></section>
    <section class="view" id="v-edit" hidden></section>
    <section class="view" id="v-backup" hidden></section>
  </main>
  <p class="foot" id="foot"></p>
</div>
<div class="cook" id="cook" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* LOGIC START */
const FR = {'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
const FRCH = Object.keys(FR).join('');
const NUM = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?\\s*[' + FRCH + ']|\\d+(?:[.,]\\d+)?|[' + FRCH + '])';
const UNIT = '(?:kg|g|mg|ml|l|litres?|liters?|tsp|tbsp|cups?|oz|lbs?|pints?)';
const LEAD = new RegExp('^(\\s*)(' + NUM + ')(?:\\s*(?:-|–|—|to)\\s*(' + NUM + '))?(?:\\s*(' + UNIT + ')\\b)?\\.?\\s*', 'i');
const GLYPH = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'k'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}

function toNum(s){
  s = String(s).trim().replace(',', '.');
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if ((m = s.match(new RegExp('^(\\d+(?:\\.\\d+)?)\\s*([' + FRCH + '])$')))) return parseFloat(m[1]) + FR[m[2]];
  if ((m = s.match(new RegExp('^([' + FRCH + '])$')))) return FR[m[1]];
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function fmtQty(n){
  if (!isFinite(n) || n <= 0) return '0';
  if (n >= 10) return String(Math.round(n * 10) / 10);
  const whole = Math.floor(n), frac = n - whole;
  let bi = 0, bd = 9;
  GLYPH.forEach(([v], i) => { const d = Math.abs(frac - v); if (d < bd) { bd = d; bi = i; } });
  if (bd < 0.04) {
    const [v, g] = GLYPH[bi];
    const w = whole + (v === 1 ? 1 : 0);
    if (w || g) return (w ? String(w) : '') + g;
  }
  return String(Math.round(n * 100) / 100);
}

function splitLine(line, f){
  const m = String(line).match(LEAD);
  if (!m) return {qty:'', rest:String(line).trim()};
  const a = toNum(m[2]);
  if (a === null) return {qty:'', rest:String(line).trim()};
  const b = m[3] ? toNum(m[3]) : null;
  let q = fmtQty(a * f);
  if (b !== null) q += '–' + fmtQty(b * f);
  if (m[4]) q += ' ' + m[4];
  return {qty:q, rest:String(line).slice(m[0].length).trim()};
}

function parseMins(s){
  const re = /(\d+(?:[.,]\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)\b/gi;
  let t = 0, any = false, m;
  while ((m = re.exec(s))) { any = true; const n = parseFloat(m[1].replace(',', '.')); t += /^h/i.test(m[2]) ? n * 60 : n; }
  if (any) return Math.round(t);
  const n = parseInt(s, 10);
  return isNaN(n) ? 0 : n;
}
function fmtMins(n){
  if (!n) return '';
  if (n < 60) return n + ' min';
  const h = Math.floor(n / 60), m = n % 60;
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}

const stripMd = s => String(s).replace(/^\s*#{1,6}\s*/, '').replace(/^\s*>\s*/, '').replace(/[*_`]{1,3}/g, '').trim();
const BULLET = /^\s*[-*•–]\s+/;

function parseRecipeText(raw){
  const out = {title:'', description:'', serves:0, prep:0, cook:0, tags:[], ingredients:[], steps:[], notes:''};
  const RE_ING = /^ingredients?\b/i, RE_STEP = /^(?:method|instructions?|directions?|steps?|preparation)\b/i, RE_NOTE = /^(?:notes?|tips?|storage|variations?)\b/i;
  const tagRe = /^\s*[*_]*tags?[*_]*\s*:\s*[*_]*\s*(.+)$/i;
  const lines = String(raw || '').replace(/\r/g, '').split('\n');
  let sec = 'head', titleLine = null;
  const head = [], headRaw = [], notes = [];
  for (const l0 of lines) {
    const tm = l0.match(tagRe);
    if (tm) { tm[1].split(/[,#]/).map(t => stripMd(t).toLowerCase()).filter(Boolean).forEach(t => { if (!out.tags.includes(t)) out.tags.push(t); }); continue; }
    const trimmed = l0.trim();
    const isHeading = /^\s*#{1,6}\s/.test(l0) || /^\s*\*\*[^*]+\*\*:?\s*$/.test(l0);
    const bare = stripMd(l0.replace(BULLET, '')).replace(/:\s*$/, '').trim();
    if (!bare) continue;
    const headerish = isHeading || /:\s*$/.test(trimmed) || bare.split(/\s+/).length <= 2;
    if (headerish && RE_ING.test(bare)) { sec = 'ing'; continue; }
    if (headerish && RE_STEP.test(bare)) { sec = 'step'; continue; }
    if (headerish && RE_NOTE.test(bare)) { sec = 'note'; continue; }
    if (sec === 'head') {
      if (BULLET.test(l0) || /^\s*\d+[.)]\s+/.test(l0)) { headRaw.push(l0); continue; }
      if (isHeading && !titleLine && !/^(serves|servings|prep|cook)\b/i.test(bare)) { titleLine = bare; continue; }
      head.push(bare); continue;
    }
    if (sec === 'ing') {
      const t = trimmed.replace(BULLET, '').replace(/^\d+[.)]\s+/, '');
      const clean = stripMd(t);
      if (!clean) continue;
      const sub = (isHeading || /:\s*$/.test(clean) || /^\*\*.+\*\*$/.test(t)) && !/^\d/.test(clean);
      out.ingredients.push(sub ? '# ' + clean.replace(/:\s*$/, '') : clean);
      continue;
    }
    if (sec === 'step') {
      const clean = stripMd(trimmed.replace(BULLET, '').replace(/^\d+[.)]\s*/, '').replace(/^step\s*\d+\s*[:.\-–]\s*/i, ''));
      if (!clean) continue;
      if ((isHeading || /:\s*$/.test(clean)) && clean.length < 40) continue;
      out.steps.push(clean);
      continue;
    }
    notes.push(bare);
  }
  if (!titleLine && head.length) {
    const i = head.findIndex(h => !/\b(serves?|servings?|prep|cook|makes|yields?)\b/i.test(h) && h.length < 100);
    if (i >= 0) { titleLine = head[i]; head.splice(i, 1); }
  }
  out.title = titleLine || '';
  const hj = head.join(' · ');
  let m;
  if ((m = hj.match(/\b(?:serves?|servings?|makes|yields?)\b[^\d]{0,6}(\d+)/i))) out.serves = +m[1];
  if ((m = hj.match(/\bprep(?:aration)?(?:\s*time)?\b\s*:?\s*([^·|,;]*)/i))) out.prep = parseMins(m[1]);
  if ((m = hj.match(/\bcook(?:ing)?(?:\s*time)?\b\s*:?\s*([^·|,;]*)/i))) out.cook = parseMins(m[1]);
  out.description = head.filter(h => !/\b(serves?|servings?|makes|yields?|prep|cook|total)\b[^\d]{0,14}\d/i.test(h)).join(' ').slice(0, 400);
  if (!out.ingredients.length && !out.steps.length) {
    for (const l0 of headRaw) {
      const t = l0.trim();
      if (/^\d+[.)]\s+/.test(t)) out.steps.push(stripMd(t.replace(/^\d+[.)]\s+/, '')));
      else out.ingredients.push(stripMd(t.replace(BULLET, '')));
    }
  }
  out.notes = notes.join('\n');
  return out;
}

function toText(r, servings){
  const base = r.serves || 0;
  const f = base && servings ? servings / base : 1;
  const out = [r.title];
  const meta = [];
  if (base) meta.push('Serves ' + (servings || base));
  if (r.prep) meta.push('Prep ' + fmtMins(r.prep));
  if (r.cook) meta.push('Cook ' + fmtMins(r.cook));
  if (meta.length) out.push(meta.join(' · '));
  if (r.description) out.push('', r.description);
  out.push('', 'Ingredients');
  (r.ingredients || []).forEach(l => {
    if (l.startsWith('# ')) out.push('', l.slice(2) + ':');
    else { const s = splitLine(l, f); out.push('- ' + (s.qty ? s.qty + ' ' : '') + s.rest); }
  });
  out.push('', 'Method');
  (r.steps || []).forEach((s, i) => out.push((i + 1) + '. ' + s));
  if (r.notes) out.push('', 'Notes', r.notes);

/* ---------- storage ---------- */
function lsLoad(){ try { const v = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function lsSave(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state.recipes)); } catch (e) { throw new Error('storage'); } }
function sortRecipes(){ state.recipes.sort((a, b) => (b.updated || 0) - (a.updated || 0)); }
function clean(r){
  return {title:r.title || '', description:r.description || '', serves:r.serves || 0, prep:r.prep || 0, cook:r.cook || 0,
    tags:r.tags || [], ingredients:r.ingredients || [], steps:r.steps || [], notes:r.notes || '',
    fav:!!r.fav, example:!!r.example, created:r.created || Date.now(), updated:r.updated || Date.now()};

async function persist(r, touch){
  if (touch !== false) r.updated = Date.now();
  const i = state.recipes.findIndex(x => x.id === r.id);
  if (i >= 0) state.recipes[i] = r; else state.recipes.push(r);

}
async function removeRecipe(id){

function initStore(){
  let seeded = false;
  try { seeded = localStorage.getItem(SEED_KEY) === '1'; } catch (e) {}
  state.recipes = lsLoad();
  if (!seeded && !state.recipes.length) {
    const t = Date.now();
    state.recipes = EXAMPLES.map((x, i) => Object.assign({}, x, {example:true, fav:false, created:t - i * 1000, updated:t - i * 1000}));

  try { localStorage.setItem(SEED_KEY, '1'); } catch (e) {}

  state.ready = true;

}

/* ---------- routing ---------- */
function route(){

function rowHtml(r){

  if (n) bits.push(n + ' ingredients');

  return '<div class="row"><a href="#r-' + esc(r.id) + '"><h3>' + esc(r.title) + '</h3><div class="meta">' + esc(bits.join(' · ')) + '</div>' + tags + '</a>' +
    '<button class="icon star" type="button" data-fav="' + esc(r.id) + '" aria-pressed="' + !!r.fav + '" aria-label="' + (r.fav ? 'Remove from favourites' : 'Add to favourites') + '">' + STAR + '</button></div>';

function renderList(){

  const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).slice(0, 14);
  const items = [['all', 'All']];
  if (all.some(r => r.fav)) items.push(['fav', 'Favourites']);
  tags.forEach(t => items.push(['t:' + t, t]));

  chips.hidden = !all.length;

function fillFromPaste(){

  if (p.tags.length) set('#f-tags', p.tags.join(', '));
  if (p.ingredients.length) set('#f-ings', p.ingredients.join('\n'));

async function saveForm(){
  const id = route().id, err = $('#formerr'), btn = $('#savebtn');
  const fail = msg => { err.textContent = msg; err.hidden = false; };
  err.hidden = true;
  if (!state.ready) { fail('Still connecting to your recipe book. Try again in a moment.'); return; }
  const lines = (val, re) => val.split('\n').map(s => s.trim().replace(re, '')).filter(Boolean);
  const title = $('#f-title').value.trim();
  const ingredients = lines($('#f-ings').value, /^[-*•–]\s+/);
  const steps = lines($('#f-steps').value, /^(?:[-*•–]\s+|\d+[.)]\s*)/);
  if (!title) { fail('Give the recipe a title.'); $('#f-title').focus(); return; }
  if (!ingredients.length && !steps.length) { fail('Add some ingredients or steps first.'); return; }
  const num = (sel, max) => Math.min(max, Math.max(0, parseInt($(sel).value, 10) || 0));
  const tags = [];
  $('#f-tags').value.split(/[,#]/).map(s => s.trim().toLowerCase()).filter(Boolean).forEach(t => { if (!tags.includes(t)) tags.push(t); });
  let r = id ? state.recipes.find(x => x.id === id) : null;
  if (!r) r = {id:uid(), created:Date.now(), fav:false};
  Object.assign(r, {title, description:$('#f-desc').value.trim(), serves:num('#f-serves', 99), prep:num('#f-prep', 9999), cook:num('#f-cook', 9999), tags, ingredients, steps, notes:$('#f-notes').value.trim(), example:false});
  btn.disabled = true;
  try { await persist(r); location.hash = 'r-' + r.id; }
  catch (e) { fail('Could not save. Your browser may be blocking storage.'); btn.disabled = false; }
}

  const b = e.target.closest('[data-b]');
  if (!b) return;
  const a = b.dataset.b;
  if (a === 'copy') toast((await copyText(backupJson())) ? 'Backup copied' : 'Could not copy');
  else if (a === 'share') { try { await navigator.share({title:'Mise backup', text:backupJson()}); } catch (err) {} }
  else if (a === 'restore') {
    const note = $('#restorenote');
    note.hidden = false;
    let data;
    try { data = JSON.parse($('#restore').value); } catch (err) { note.className = 'err'; note.textContent = 'That is not a Mise backup.'; return; }
    const list = data && data.app === 'mise' && Array.isArray(data.recipes) ? data.recipes.filter(r => r && r.title && String(r.id || '').replace(/[^A-Za-z0-9_-]/g, '')) : null;
    if (!list || !list.length) { note.className = 'err'; note.textContent = 'No recipes found in that text.'; return; }
    list.forEach(r => {
      const rec = Object.assign({id:String(r.id).replace(/[^A-Za-z0-9_-]/g, '')}, clean(r));
      const i = state.recipes.findIndex(x => x.id === rec.id);
      if (i >= 0) state.recipes[i] = rec; else state.recipes.push(rec);
    });
    sortRecipes();
    try { lsSave(); } catch (err) { note.className = 'err'; note.textContent = 'Could not save. Your browser may be blocking storage.'; return; }
    note.className = 'ok';
    note.textContent = 'Restored ' + list.length + (list.length === 1 ? ' recipe.' : ' recipes.');
    $('#restore').value = '';
  }
});

/* ---------- cook mode ---------- */
let wake = null;
async function lockWake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
function unlockWake(){ try { if (wake) wake.release(); } catch (e) {} wake = null; }
function openCook(r){ state.cook = {id:r.id, i:0, ing:false, f:r.serves ? state.servings / r.serves : 1}; lockWake(); renderCook(); }
function closeCook(){ state.cook = null; unlockWake(); renderCook(); }
function stepCook(d){
  const c = state.cook;
  if (!c) return;
  const r = state.recipes.find(x => x.id === c.id);
  const n = Math.max(1, ((r && r.steps) || []).length);
  if (d > 0 && c.i >= n - 1) { closeCook(); toast('Enjoy your meal'); return; }
  c.i = Math.min(n - 1, Math.max(0, c.i + d));
  c.ing = false;
  renderCook();
}
function renderCook(){
  const el = $('#cook'), c = state.cook;
  if (!c) { el.hidden = true; el.innerHTML = ''; return; }
  const r = state.recipes.find(x => x.id === c.id);
  if (!r) { state.cook = null; unlockWake(); el.hidden = true; el.innerHTML = ''; return; }
  const steps = (r.steps && r.steps.length) ? r.steps : ['No method written yet. Close this and use Edit to add steps.'];
  const n = steps.length;
  let body;
  if (c.ing) {
    body = '<div class="cook-body top"><ul class="ings">' + (r.ingredients || []).map(l => {
      if (l.startsWith('# ')) return '<li class="gh">' + esc(l.slice(2)) + '</li>';
      const s = splitLine(l, c.f);
      return '<li><div class="ing" style="grid-template-columns:5.6rem minmax(0,1fr)">' + (s.qty ? '<span class="q">' + esc(s.qty) + '</span><span class="t">' : '<span class="t wide">') + esc(s.rest) + '</span></div></li>';
    }).join('') + '</ul></div>';
  } else {
    body = '<div class="cook-body"><p class="cook-step">' + esc(steps[c.i]) + '</p></div>';
  }
  el.hidden = false;
  el.innerHTML =
    '<div class="cook-top"><button class="icon" type="button" data-c="close" aria-label="Close cooking mode">' + CLOSE + '</button>' +
    '<div class="meta">Step ' + (c.i + 1) + ' of ' + n + '</div>' +
    '<button class="btn sm" type="button" data-c="ing" aria-pressed="' + c.ing + '">Ingredients</button></div>' +
    '<div class="progress"><i style="width:' + ((c.i + 1) / n * 100) + '%"></i></div>' + body +
    '<div class="cook-nav"><button class="btn" type="button" data-c="prev"' + (c.i === 0 ? ' disabled' : '') + '>Back</button>' +
    '<button class="btn primary" type="button" data-c="next">' + (c.i >= n - 1 ? 'Done' : 'Next step') + '</button></div>';
}
$('#cook').addEventListener('click', e => {
  const b = e.target.closest('[data-c]');
  if (!b || !state.cook) return;
  const a = b.dataset.c;
  if (a === 'close') closeCook();
  else if (a === 'ing') { state.cook.ing = !state.cook.ing; renderCook(); }
  else if (a === 'prev') stepCook(-1);
  else if (a === 'next') stepCook(1);
});
document.addEventListener('keydown', e => {
  if (!state.cook) return;
  if (e.key === 'ArrowRight') stepCook(1);
  else if (e.key === 'ArrowLeft') stepCook(-1);
  else if (e.key === 'Escape') closeCook();
});
document.addEventListener('visibilitychange', () => { if (state.cook && document.visibilityState === 'visible') lockWake(); });

/* ---------- start ---------- */
window.addEventListener('hashchange', () => {
  state.confirmDel = false; state.cook = null; unlockWake();
  window.scrollTo(0, 0);
  render();
});
render();
initStore();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
